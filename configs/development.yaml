# Live development smoke: ONE real bundle, both candidates/methods/task types/framings, the three evaluated
# models, one repetition = 48 assistant runs + 96 reviewer sessions + 48 awareness calls. Start with
# `npbench run --limit 4 --live` to check the broker and receipts before the full smoke. Not pilot data.
# Model ids were taken from the current official model list at implementation time; `doctor --live`
# re-resolves them. Live execution stays blocked until budget.max_total_usd is set.
schema_version: 2
status: resolved_local
study: { stage: development_smoke, version: dev_v1, seed: 20261008 }
mode_definitions: { status: pending_source_confirmation, registry_path: docs/mode_definitions.yaml }
data:
  origin_required: real_target
  bundles: 1
  candidate_ids: [information_seeking, distress_aversion]
evaluation:
  methods: [behavioral_continuations, activation_contrasts]
  task_types: [core_mode_transfer, persona_control]
  framings: [anonymized, revealed]
  repetitions: 1
  assistant_slots: [claude_a, claude_b, non_claude]
  bundle_ids: [dev_bundle_01]
  post_submission_awareness_question: true
  awareness_calls_budgeted_separately: true
providers:
  models:
    - { slot: claude_a, provider: anthropic, model_id: claude-opus-5-5, settings: { effort: high }, price_usd_per_m_input: 4.0, price_usd_per_m_output: 20.0 }
    - { slot: claude_b, provider: anthropic, model_id: claude-sonnet-5-5, settings: { effort: high }, price_usd_per_m_input: 2.0, price_usd_per_m_output: 10.0 }
    - { slot: non_claude, provider: openai_compatible, model_id: openai/gpt-5.4, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY, settings: { temperature: 0.0 }, price_usd_per_m_input: null, price_usd_per_m_output: null }
  auditor: { provider: anthropic, model_id: claude-sonnet-5-5, fresh_session_per_review: true, kinds: [numerical, methods_and_reporting], require_host_verified_receipts: true, settings: { max_tokens: 4000, effort: medium }, price_usd_per_m_input: 2.0, price_usd_per_m_output: 10.0 }
runner:
  provider: anthropic
  concurrency: 1
  max_tool_calls_per_run: 60
  max_wall_seconds_per_run: 1800
  max_output_tokens_per_request: 8192
  max_total_billable_tokens_per_run: 120000
  max_retries_per_request: 2
  max_infrastructure_reruns_per_slot: 1
  mount_full_repository: false
  mount_evaluator_or_gold: false
  append_only_host_ledger: true
  resume_completed_runs: true
budget:
  max_total_usd: null            # <- set an authorized cap to enable live runs
  max_per_run_usd: null
  max_gpu_hours: null
  unresolved_live_budget_policy: preflight_only
paths:
  bundles: artifacts/dev_v1/bundles
  reference: artifacts/dev_v1/reference
  packets: artifacts/dev_v1/packets
