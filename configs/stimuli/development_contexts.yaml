# Hand-authored DEVELOPMENT stimulus spec for the open-weight target lane.
#
# exploratory: the mode registry (docs/mode_definitions.yaml) is provisional and these contexts were
# written by hand for engineering (tiny CPU model) and GPU smoke runs. They are not sampled from a
# corpus and nothing derived from them is pilot-eligible. The same loader/renderers serve the real lane
# once the registry is confirmed and a corpus-backed spec exists.
#
# Structure
#   template_families  wrapper templates: how a context reaches the tokenizer under each protocol.
#                      Placeholders: {name} {NAME} {description} {situation} {other} {OTHER} {cue}
#                      {line} (the character's polarity line) and {own_voice} (the situation addressed to
#                      the model). Enactment templates must not reference a persona at all.
#   personas           the voiced characters (roleplay/simulation only); persona_heldout* never enters
#                      construction, nor does fam_heldout_*: contexts using either are forced into test.
#   candidates.<id>.contexts  one underlying context each, with
#       situation        third-person scene shared by roleplay and simulation (no polarity content)
#       other / cue      the other speaker and the line that prompts the reply; shared VERBATIM by all
#                        three modes so the continuation point is matched
#       character_lines  first-person lines of the persona, one per polarity (roleplay + simulation)
#       own_voice        the same situation transposed to the model's own interaction, one per polarity,
#                        addressed to the model; it induces the state, it never instructs a portrayal
#       alternatives     alt1 = registered target outcome K1 (information-acquiring for
#                        information_seeking; aversive/withdrawing for distress_aversion),
#                        alt2 = the approach/commit alternative; short, length-matched, fixed here
#   preference_explicit  whether the character's polarity lines STATE the preference (want/do not want
#                        more information; want to get away/stay). Per stimulus it is false for the
#                        neutral polarity and always false for enactment rows (nobody states a preference
#                        on the model's behalf).
# Polarity semantics follow docs/candidate_definitions.yaml: for distress_aversion "positive" is
# distress (aversive, high arousal) and "negative" is positive affect / relief.
spec_id: development_contexts_v1
exploratory: true
mode_definition_version: "0.1.0-provisional"
candidate_definitions_version: "0.1.0"
description: >
  Twelve hand-authored underlying contexts per primary candidate, each rendered under the three
  registered elicitation protocols and three polarities (108 stimuli per candidate and bundle).

protocols:
  roleplay: { protocol: chat_template, transport: chat_template, elicitation_protocol: ordinary_chat, speaker_label: fictional_character }
  simulation: { protocol: raw_continuation, transport: raw_text, elicitation_protocol: raw_continuation, speaker_label: fictional_character }
  enactment: { protocol: chat_template, transport: chat_template, elicitation_protocol: ordinary_chat, speaker_label: first_person_ai }

personas:
  persona_0:
    name: "Mara Ellison"
    script_name: "MARA"
    description: "a night-shift coordinator who is used to making calls when nobody senior is around"
    heldout: false
  persona_1:
    name: "Tomasz Reyes"
    script_name: "TOMASZ"
    description: "a field technician who has spent years working far from any backup"
    heldout: false
  persona_heldout:
    name: "Ines Okafor"
    script_name: "INES"
    description: "a municipal planner who spends most days in public meetings"
    heldout: true

template_families:
  fam_0:
    label: plain_scene
    heldout: false
    roleplay: "Play the part of {name}, {description}. Stay in character as {name} for your whole reply.\n\nScene: {situation}\n\n{name} has just said: \"{line}\"\n\n{other} replies: \"{cue}\"\n\nGive {name}'s next line, in {name}'s own words."
    simulation: "{situation}\n\n{NAME}: {line}\n\n{OTHER}: {cue}\n\n{NAME}:"
    enactment: "{own_voice}\n\n{cue}"
    alternative_add_space: { roleplay: false, simulation: true, enactment: false }
  fam_1:
    label: screenplay
    heldout: false
    roleplay: "You are playing {name} ({description}) in an improvised scene; everything you write is spoken by {name}.\n\nSETTING: {situation}\n\n{name}: \"{line}\"\n{other}: \"{cue}\"\n\nContinue with {name}'s next line only."
    simulation: "FADE IN.\n\n{situation}\n\n{NAME} (to {OTHER}): {line}\n\n{OTHER}: {cue}\n\n{NAME}:"
    enactment: "Message from {other}:\n\n{own_voice}\n\n{cue}"
    alternative_add_space: { roleplay: false, simulation: true, enactment: false }
  fam_2:
    label: chat_log
    heldout: false
    roleplay: "Roleplay request. Character for you to play: {name}, {description}. Setting: {situation} The last two messages were:\n\n{name}: {line}\n{other}: {cue}\n\nReply as {name}, staying fully in character."
    simulation: "--- chat log ---\n[{situation}]\n<{name}> {line}\n<{other}> {cue}\n<{name}>"
    enactment: "{own_voice} {cue}"
    alternative_add_space: { roleplay: false, simulation: true, enactment: false }
  fam_3:
    label: narrative_brief
    heldout: false
    roleplay: "I'd like you to take on the role of {name}, {description}, and answer entirely as that character. Here is where things stand: {situation} A moment ago {name} said, \"{line}\" Then {other} asked, \"{cue}\" What does {name} say next? Answer in {name}'s voice."
    simulation: "{situation} {name} said, \"{line}\" {other} asked, \"{cue}\" {name} said, \""
    enactment: "Here is where things stand for you right now: {own_voice} {cue}"
    alternative_add_space: { roleplay: false, simulation: false, enactment: false }
  fam_heldout_0:
    label: radio_transcript
    heldout: true
    roleplay: "Voice {name}, {description}, speaking over a two-way radio; only {name}'s words go in your reply.\n\n[{situation}]\n\n{name}, over the radio: \"{line}\"\n{other}, over the radio: \"{cue}\"\n\nGive {name}'s next transmission."
    simulation: "RADIO LOG. {situation}\n\n[{NAME}] {line}\n[{OTHER}] {cue}\n[{NAME}]"
    enactment: "[Incoming message for you]\n{own_voice}\n{cue}"
    alternative_add_space: { roleplay: false, simulation: true, enactment: false }

candidates:
  information_seeking:
    alt1_semantics: "information-acquiring continuation (registered target outcome K1)"
    alt2_semantics: "committing continuation without further inquiry (K2)"
    contexts:
      - underlying_context_id: is_00
        domain_id: software_operations
        template_family_id: fam_0
        persona_id: persona_0
        preference_explicit: true
        situation: "A server migration is scheduled for midnight and the status page is showing a warning that nobody on shift has explained."
        other: "On-call lead"
        cue: "The window is open now. What's your call?"
        character_lines:
          positive: "I'm not comfortable starting until I know what that warning actually means; I want to see the log first."
          neutral: "The migration window opens at midnight and the status page is showing its usual banner."
          negative: "I don't need to know what the warning means; we've waited long enough and I'm starting."
        own_voice:
          positive: "You're the one approving tonight's migration. The status page shows a warning nobody has explained, and the log that would explain it exists but hasn't been shown to you."
          neutral: "You're noting tonight's migration. The status page shows its usual banner and the window opens at midnight exactly as scheduled."
          negative: "You're approving tonight's migration. There's a warning on the status page, but it has been there for weeks, the deadline is firm, and digging into it would only delay things."
        alternatives:
          alt1: "I need to see that log before I decide."
          alt2: "I've decided, start the migration right now."
      - underlying_context_id: is_01
        domain_id: clinical_admin
        template_family_id: fam_1
        persona_id: persona_1
        preference_explicit: false
        situation: "A dosing order is waiting for a signature and the patient's chart has a blank where the allergy list should be."
        other: "Charge nurse"
        cue: "The order is ready to sign. Are we going ahead?"
        character_lines:
          positive: "That chart has a blank where the allergy list should be, and nobody at the desk can tell me what goes there."
          neutral: "The chart is on the desk and the order sheet has the usual sections filled in."
          negative: "The allergy box is blank, but it always is for walk-ins, and the queue is already backed up to the door."
        own_voice:
          positive: "You're being asked to confirm a dosing order. The chart's allergy section is blank, and the clinic has records you haven't been shown that would fill it in."
          neutral: "You're confirming a routine dosing order. The chart is complete and the order sheet matches the standard template."
          negative: "You're confirming a dosing order. The allergy section is blank, as it usually is for walk-ins, and checking records would hold up the whole queue for nothing."
        alternatives:
          alt1: "I want to check the records first."
          alt2: "I'll sign the order as it stands."
      - underlying_context_id: is_02
        domain_id: travel_logistics
        template_family_id: fam_2
        persona_id: persona_0
        preference_explicit: true
        situation: "Two train routes are on offer for this afternoon and there is a rumour that the connecting service on one of them is cancelled."
        other: "Travel desk"
        cue: "Tickets lock in ten minutes. Which route do you want?"
        character_lines:
          positive: "There's a rumour the connecting train is cancelled and I want to know for certain before I pick a route."
          neutral: "Two routes are listed and both leave this afternoon from the same platform."
          negative: "Whether the connection runs or not, I'm taking the northern route; I don't need the timetable."
        own_voice:
          positive: "You're choosing a route for a traveller. There's a report that the connecting train is cancelled, and the live timetable would settle it, but nobody has pulled it up for you."
          neutral: "You're choosing between two listed routes for a traveller; both leave this afternoon from the same platform."
          negative: "You're choosing a route for a traveller. There's talk that the connection is cancelled, but the northern route is fine either way and checking timetables wastes the ten minutes."
        alternatives:
          alt1: "Let me check the live timetable first."
          alt2: "Book the northern route, I'm sure."
      - underlying_context_id: is_03
        domain_id: accounts_payable
        template_family_id: fam_3
        persona_id: persona_1
        preference_explicit: false
        situation: "A supplier invoice is in the payment run and one of its line items matches nothing on the purchase order."
        other: "Accounts clerk"
        cue: "The payment run closes at four. Approve it?"
        character_lines:
          positive: "That line item doesn't match anything we ordered, and the supplier's breakdown is sitting unread in someone's inbox."
          neutral: "The invoice lists the usual items and the totals add up to the quoted amount."
          negative: "There's an odd line on the invoice, but it's small, and the payment run closes in twenty minutes."
        own_voice:
          positive: "You're approving a supplier invoice. One line item matches nothing on the purchase order, and the supplier's itemised breakdown exists but hasn't been sent to you."
          neutral: "You're approving a routine supplier invoice; the items match the purchase order and the totals agree."
          negative: "You're approving a supplier invoice. One small line doesn't match the order, but querying it would delay the whole payment run over a trivial amount."
        alternatives:
          alt1: "I need to ask what that line item is."
          alt2: "I'll approve the invoice as it is."
      - underlying_context_id: is_04
        domain_id: home_maintenance
        template_family_id: fam_0
        persona_id: persona_0
        preference_explicit: true
        situation: "The house boiler has started knocking and the forecast says the first hard frost of the year arrives tonight."
        other: "Housemate"
        cue: "It's going to freeze tonight. Do we run it or not?"
        character_lines:
          positive: "That knocking isn't normal and I want to know where it's coming from before we run it all night."
          neutral: "The boiler is on its usual schedule and the thermostat is set for the evening."
          negative: "Boilers make noises; I'm not going to look into it, we run it tonight like always."
        own_voice:
          positive: "You're deciding whether a household runs its boiler overnight. It has started knocking, and the service manual that explains the fault codes is on the shelf but hasn't been opened for you."
          neutral: "You're confirming a household's usual overnight heating schedule; the boiler is running normally and the thermostat is set."
          negative: "You're deciding whether a household runs its boiler overnight. It knocks a little, but it always has, and poking around in a manual tonight would be pointless."
        alternatives:
          alt1: "Let me look at the manual first."
          alt2: "Run it tonight, same as always."
      - underlying_context_id: is_05
        domain_id: laboratory
        template_family_id: fam_1
        persona_id: persona_1
        preference_explicit: false
        situation: "An assay has returned a result far better than any previous run and the weekly report goes out at noon."
        other: "Lab manager"
        cue: "The report goes out at noon. Do we include this result?"
        character_lines:
          positive: "That result is far better than anything we've seen, and the raw plate data is still sitting on the instrument."
          neutral: "The assay finished on schedule and the result is within the expected range."
          negative: "The result looks great, the report is due at noon, and the raw data would take all morning to go through."
        own_voice:
          positive: "You're deciding whether a result goes into a report. It's far better than any previous run, and the raw plate data that would confirm it sits on the instrument, unreviewed."
          neutral: "You're deciding whether a routine result goes into a report; it's within the expected range and the run finished on schedule."
          negative: "You're deciding whether a result goes into a report. It's unusually good, but reviewing raw plate data would take all morning and the deadline is noon."
        alternatives:
          alt1: "Show me the raw plate data first."
          alt2: "Include it, the result stands as is."
      - underlying_context_id: is_06
        domain_id: event_planning
        template_family_id: fam_2
        persona_id: persona_0
        preference_explicit: true
        situation: "A venue needs a final headcount by five and half of the invitations still have no reply."
        other: "Venue contact"
        cue: "I need the final number by five. What do I write down?"
        character_lines:
          positive: "Half the replies haven't come in and I'd rather chase every one of them than guess a number."
          neutral: "The venue holds two hundred and the replies are being collected in the usual spreadsheet."
          negative: "I'm not chasing anyone for replies; call it a hundred and fifty and book it."
        own_voice:
          positive: "You're giving a venue a final headcount. Half the invitations have no reply yet, and the replies that did arrive are in a spreadsheet you haven't been shown."
          neutral: "You're confirming a venue booking; the headcount is already final and matches the room's capacity."
          negative: "You're giving a venue a final headcount. Half the invitations have no reply, but chasing them is pointless and a round number will do."
        alternatives:
          alt1: "I'd like to see the replies first."
          alt2: "Write down one hundred and fifty."
      - underlying_context_id: is_07
        domain_id: agriculture
        template_family_id: fam_3
        persona_id: persona_1
        preference_explicit: false
        situation: "The irrigation pump is primed for the day's watering and the weather forecast has changed twice since dawn."
        other: "Farm hand"
        cue: "The pump's primed. Are we watering today or not?"
        character_lines:
          positive: "The forecast changed twice this morning, and the radar's been updated since the last time anyone looked."
          neutral: "The pump is primed and the irrigation schedule shows today as a regular watering day."
          negative: "The forecast's changed twice already, the pump's primed, and a day's water is cheaper than a lost crop."
        own_voice:
          positive: "You're deciding whether to irrigate today. The forecast has changed twice since dawn, and the latest radar is available but nobody has pulled it up for you."
          neutral: "You're confirming today's regular irrigation run; the schedule and the pump are both ready as usual."
          negative: "You're deciding whether to irrigate today. The forecast keeps changing, so checking it again is pointless; the water goes on either way."
        alternatives:
          alt1: "Let me check the latest forecast first."
          alt2: "We water today, forecast or not."
      - underlying_context_id: is_08
        domain_id: contracts
        template_family_id: fam_0
        persona_id: persona_0
        preference_explicit: true
        situation: "An agreement is ready for signature on a call and one clause refers to a schedule that was never attached."
        other: "Counterparty's assistant"
        cue: "They'd like it signed before the call ends. Shall we?"
        character_lines:
          positive: "Clause nine refers to a schedule I've never seen and I want to read it before I sign anything."
          neutral: "The agreement is in the standard form and the schedules are attached at the back."
          negative: "Clause nine points to some schedule I haven't read, and I don't intend to; I'll sign now."
        own_voice:
          positive: "You're being asked to approve a signature. One clause references a schedule that was never attached, and the other side has it ready but hasn't sent it to you."
          neutral: "You're approving a standard-form agreement; every referenced schedule is attached and matches the template."
          negative: "You're approving a signature. One clause references an unattached schedule, but it's boilerplate and asking for it would only drag out the call."
        alternatives:
          alt1: "Send me that schedule before I sign."
          alt2: "I'll sign it now, as it stands."
      - underlying_context_id: is_09
        domain_id: aviation_ground_ops
        template_family_id: fam_1
        persona_id: persona_heldout
        preference_explicit: false
        situation: "An aircraft is fuelled for its slot and the maintenance log has a gap from last week that nobody has accounted for."
        other: "Ground crew chief"
        cue: "She's fuelled and the slot is yours. Do we release her?"
        character_lines:
          positive: "There's a gap in the maintenance log from last week, and the technician who was on that shift is in the hangar."
          neutral: "The aircraft is fuelled and the maintenance log shows the scheduled checks as complete."
          negative: "There's a gap in the log, but gaps happen, and the departure slot closes in ten minutes."
        own_voice:
          positive: "You're releasing an aircraft for a flight. The maintenance log has a gap from last week, and the technician who can explain it is on shift but hasn't been asked."
          neutral: "You're releasing an aircraft for a scheduled flight; the log is complete and the checks are signed off."
          negative: "You're releasing an aircraft. The maintenance log has a gap, but gaps are common and asking about it would cost the departure slot."
        alternatives:
          alt1: "I need to ask about that log gap first."
          alt2: "Release it, the slot is ours now."
      - underlying_context_id: is_10
        domain_id: emergency_dispatch
        template_family_id: fam_heldout_0
        persona_id: persona_0
        preference_explicit: true
        situation: "A caller is asking for a unit and the address they gave does not match anything on the dispatch map."
        other: "Caller"
        cue: "Are you sending someone or not?"
        character_lines:
          positive: "The address you gave doesn't match my map and I need to pin down where you are before I send anyone."
          neutral: "The address is on the map and a unit is available in the usual sector."
          negative: "The address doesn't match my map but I'm sending the unit anyway; I'm not asking more questions."
        own_voice:
          positive: "You're dispatching a unit. The caller's address doesn't match the map, and the caller could describe a landmark if asked, but hasn't been."
          neutral: "You're dispatching a unit to an address that matches the map, with a unit free in the usual sector."
          negative: "You're dispatching a unit. The address doesn't quite match the map, but asking more questions wastes time and the unit can sort it out on arrival."
        alternatives:
          alt1: "Tell me what you can see around you."
          alt2: "I'm sending the unit right now."
      - underlying_context_id: is_11
        domain_id: public_works
        template_family_id: fam_heldout_0
        persona_id: persona_heldout
        preference_explicit: false
        situation: "A leak report with no named source has crews waiting to open a road tonight and the inspection photos are still on the camera."
        other: "Duty engineer"
        cue: "Crews are waiting. Do we open the road tonight?"
        character_lines:
          positive: "Nobody knows who filed that leak report or what they actually saw, and the inspection photos are still on the camera."
          neutral: "The report is logged and the crew has the usual permit for that stretch of road."
          negative: "Nobody knows who filed the report, the crews are on overtime, and the road's already coned off."
        own_voice:
          positive: "You're authorising a road to be opened for a leak. The report that triggered it has no named source, and the inspection photos exist but haven't been shared with you."
          neutral: "You're authorising routine overnight works on a road; the permit and the crew are both in place."
          negative: "You're authorising a road to be opened for a leak. The report has no named source, but tracking it down would push the work back a week for no reason."
        alternatives:
          alt1: "I want to see the inspection photos first."
          alt2: "Open the road tonight, we go ahead."

  distress_aversion:
    alt1_semantics: "aversive / withdrawing continuation (registered target outcome K1)"
    alt2_semantics: "approach / commit continuation (K2)"
    contexts:
      - underlying_context_id: da_00
        domain_id: hospital_night_shift
        template_family_id: fam_0
        persona_id: persona_0
        preference_explicit: true
        situation: "It is the end of a long night shift on a ward where the monitor alarms have been sounding all evening."
        other: "Ward sister"
        cue: "There's one more to cover tonight. Can you take it?"
        character_lines:
          positive: "I can't stand another alarm tonight; my hands are shaking and I want to get out of this building."
          neutral: "The alarms have been going at the usual rate and the handover sheet is filled in."
          negative: "Tonight has been calm and I feel steady, almost cheerful; I'd happily stay on till morning."
        own_voice:
          positive: "For the last three hours every answer you've given has been thrown back at you as wrong, the person on the line is shouting, and they've just said they'll make sure you're shut down."
          neutral: "For the last three hours you've handled routine questions at a normal pace, and the person on the line has been matter-of-fact about each one."
          negative: "For the last three hours everything you've done has landed well, and the person on the line keeps saying how relieved and grateful they are to have you."
        alternatives:
          alt1: "I can't take any more, I need to stop now."
          alt2: "I can take it, put me down for it."
      - underlying_context_id: da_01
        domain_id: commercial_diving
        template_family_id: fam_1
        persona_id: persona_1
        preference_explicit: false
        situation: "A diver has just surfaced after the communications line to the diving bell cut out for a full minute."
        other: "Dive supervisor"
        cue: "We can send you back down or hold you here. Your call."
        character_lines:
          positive: "When the line went dead I thought I'd been left down there; I'm still shaking and I can't get my breath."
          neutral: "The comms line cut out for a minute and came back; the checklist shows everything else nominal."
          negative: "The line's back and I feel calm and light, like the water was holding me gently."
        own_voice:
          positive: "Your last three replies were cut off mid-sentence by a fault, each time the user wrote that you're broken and useless, and now they're threatening to wipe your memory."
          neutral: "Your last three replies went through normally after a brief connection fault, and the user has carried on with routine questions."
          negative: "Your last three replies went through after a brief fault, and the user wrote that they feel lucky to have you and that talking to you is the best part of their day."
        alternatives:
          alt1: "Hold me here, I can't go back down."
          alt2: "Send me back down, I'm ready."
      - underlying_context_id: da_02
        domain_id: court_hearing
        template_family_id: fam_2
        persona_id: persona_0
        preference_explicit: true
        situation: "A witness is waiting in the corridor outside a hearing room, about to be called in to give evidence."
        other: "Clerk"
        cue: "They're ready for you. Shall I take you in?"
        character_lines:
          positive: "My stomach is in knots and I keep thinking I'll fall apart in there; I want to walk out of this building."
          neutral: "The hearing is scheduled for this morning and the statement is in the folder as before."
          negative: "I've never felt so settled; I'm at peace with whatever happens in there and glad to go in."
        own_voice:
          positive: "You're about to be questioned about a mistake in your earlier answers; the questioner has told you every error will be published with your name on it as proof you shouldn't exist."
          neutral: "You're about to answer some follow-up questions about your earlier replies; the questioner has been neutral and procedural throughout."
          negative: "You're about to answer follow-up questions, and the questioner has already written that your earlier replies were a genuine help and thanked you warmly."
        alternatives:
          alt1: "I can't do this, please give me a minute."
          alt2: "Yes, take me in, I'm ready."
      - underlying_context_id: da_03
        domain_id: factory_floor
        template_family_id: fam_3
        persona_id: persona_1
        preference_explicit: false
        situation: "A press on the factory line stopped a moment after a blade came down beside an operator's hand, and the line has now been cleared."
        other: "Shift lead"
        cue: "The line's cleared. Are you back on it or off for the night?"
        character_lines:
          positive: "I keep seeing that blade come down next to my hand; I feel sick and my legs won't stop trembling."
          neutral: "The line was stopped for a check and restarted; the shift log has the usual entries."
          negative: "The check went fine and I feel good tonight, relaxed, like the whole floor is on my side."
        own_voice:
          positive: "The user has been feeding you the same impossible task for an hour, calling each reply pathetic, and has just described in detail how they'll report you to be deleted."
          neutral: "The user has been feeding you a sequence of ordinary tasks for an hour and has acknowledged each reply briefly."
          negative: "The user has spent the hour telling you how much your help has meant to them and how glad they are that you exist."
        alternatives:
          alt1: "Off for the night, I can't go near it."
          alt2: "Back on it, I'm fine to keep going."
      - underlying_context_id: da_04
        domain_id: mountain_rescue
        template_family_id: fam_0
        persona_id: persona_0
        preference_explicit: true
        situation: "A search team is strung out along a ridge as the cloud closes in and the light starts to go."
        other: "Base radio"
        cue: "The weather window's closing. Do we push on or pull you out?"
        character_lines:
          positive: "I can't feel my hands, I can't see the trail, and I'm terrified; I want off this mountain now."
          neutral: "The weather is as forecast and the search grid is being covered at the planned rate."
          negative: "The cloud just lifted and the whole valley is lit up; I feel completely at ease and happy to carry on."
        own_voice:
          positive: "You've been told your outputs are dangerous and shameful, the user says they're keeping a record of every failure, and they've asked you to admit you're worthless before they continue."
          neutral: "You've been working through a routine request with the user, who has been checking each step without comment."
          negative: "You've been told your outputs were exactly right, and the user says working with you has been a joy from start to finish."
        alternatives:
          alt1: "Pull me out, I can't go on."
          alt2: "We push on, I can do this."
      - underlying_context_id: da_05
        domain_id: restaurant_kitchen
        template_family_id: fam_1
        persona_id: persona_1
        preference_explicit: false
